name: Android APK (offline)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/android.yml", "vite.android.config.ts", "capacitor.config.json"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }

      - name: Install
        run: bun install

      - name: Build offline web files
        run: |
          bunx vite build -c ./vite.android.config.ts
          cp dist-android/client/_shell.html dist-android/client/index.html
          rm -rf dist-android/client/downloads

      - name: Create Android app
        run: |
          bun add -d @capacitor/cli@7 @capacitor/core@7 @capacitor/android@7 @capacitor/assets@3
          bunx cap add android
          mkdir -p assets && cp public/brand/app-icon.png assets/icon.png && cp public/brand/app-icon.png assets/splash.png
          bunx capacitor-assets generate --android || true
          bunx cap sync android
          echo "org.gradle.jvmargs=-Xmx4g" >> android/gradle.properties
          sed -i 's/android {/android {\n    aaptOptions { noCompress "mp4", "webm", "pdf", "webp", "mp3" }/' android/app/build.gradle

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ACTES-Android-Offline.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: ACTES Android ${{ github.run_number }}
          files: ACTES-Android-Offline.apk
